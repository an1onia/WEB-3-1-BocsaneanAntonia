<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Laboratorul 3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Piatra, Hârtia, Foarfeca</h1>

    <div class="butoane">
        <button id="btnPiatra">Piatra</button>
        <button id="btnHartia">Hârtia</button>
        <button id="btnFoarfeca">Foarfeca</button>
        <button id="btnReset">Joc nou</button>
    </div>

    <div class="alegeri">
        <p>Alegerea ta: <b id="alegereJucator">-</b></p>
        <p>Alegerea calculatorului: <b id="alegereCalculator">-</b></p>
    </div>

    <h2 id="rezultat">Alege o variantă</h2>

    <div class="scor">
        <p>Tu: <span id="scorJucator">0</span></p>
        <p>Calculator: <span id="scorCalculator">0</span></p>
        <p>Egalități: <span id="scorEgalitati">0</span></p>
        <p>Runde jucate: <span id="totalRunde">0</span></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
